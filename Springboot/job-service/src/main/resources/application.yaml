spring:
    flyway:
       enabled: false
       # Unique path — avoids collision with security-module's db/migration entries
       # which also live under classpath:db/migration in the fat JAR.
       locations: classpath:db/job-migration
       table: flyway_schema_history_job
    application:
        name: job-portal-service

    # ── Spring Cloud ─────────────────────────────────────────────────────────
    # Spring Cloud 2024.0.1 officially targets Boot 3.4.x;
    # disable the version check so this service starts on Boot 3.5.x
    cloud:
        compatibility-verifier:
            enabled: false

    # ── Redis Cache ──────────────────────────────────────────────────────────
    data:
        redis:
            host: localhost
            port: 6379
            timeout: 2000ms
            # Lazy connection: the pool is not acquired until the first command.
            # This prevents startup failure when Redis is not yet available.
            lettuce:
                pool:
                    enabled: false       # disable commons-pool (not on classpath)
    cache:
        # Set to 'redis' in production when Redis is available.
        # Set to 'none' for local development without Redis (uses in-memory ConcurrentMap).
        type: none

    datasource:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://localhost:5432/job_portal_db
        username: postgres
        password: "0000"
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false  # SQL logging is handled by logback-spring.xml (org.hibernate.SQL logger)
        open-in-view: false # OpenInView set with false as with true/default
        # springboot will keep the db session open for every http request
        # even during data serializationn

    # ── Kafka Producer ────────────────────────────────────────────────────────
    kafka:
        bootstrap-servers: localhost:9092
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            retries: 3

server:
    port: 8082

# ── Eureka client registration ─────────────────────────────────────────────
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
    instance:
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 10
        lease-expiration-duration-in-seconds: 30

# ── Kafka topic names ─────────────────────────────────────────────────────
app:
    kafka:
        topics:
            job-events: job-events

# ── Feign client ─────────────────────────────────────────────────────────────
feign:
    circuitbreaker:
        enabled: true

security:
    jwt:
        secretKey: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # 256-bit Base64
        expiration: 86400000 # 24 hours (was 2 min — extended for local dev)
        refresh-expiration: 604800000 # 7 days
        issuer: job-portal-service
    cors:
        allowed-origins:
        - http://localhost:4200
        - http://localhost:3000
        allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        allowed-headers: "*"
        allow-credentials: true
        max-age: 3600

# ─── Actuator & Tracing ───────────────────────────────────────────────────────
management:
    server:
        port: 8085          # expose actuator on a separate port (not reachable via public ingress)
    tracing:
        sampling:
            probability: 1.0
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
            base-path: /actuator
    endpoint:
        health:
            show-details: always   # full component details only for authenticated callers
            probes:
                enabled: true               # exposes /actuator/health/liveness and /actuator/health/readiness
    metrics:
        tags:
            application: ${spring.application.name}  # label every metric with the service name

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
    level:
        root: INFO
        com.learning: DEBUG                          # always verbose for our code
        org.springframework.web: WARN               # suppress Spring MVC noise
        org.springframework.security: WARN          # suppress Security filter chain noise
        org.hibernate.SQL: WARN                     # SQL off by default; dev profile enables it
        org.hibernate.orm.jdbc.bind: WARN           # bind params off by default
        org.flywaydb: INFO                          # migration events always visible
        io.jsonwebtoken: WARN                       # JWT library internals suppressed
        org.apache.kafka: WARN                      # Kafka client noise suppressed
        # Activated automatically by logback-spring.xml when profile=debug.
        # Listed here for visibility — has no effect unless profile=debug is active.
        org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
