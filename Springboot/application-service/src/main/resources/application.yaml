spring:
  application:
    name: application-service

  # ── Disable Spring Boot datasource/JPA/Flyway auto-config ────────────────────
  # We register two datasources manually (PostgreSQL primary, MySQL secondary).
  # Auto-config expects exactly one DataSource — excluding it prevents startup errors.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  # ── Primary datasource: PostgreSQL (applications, resumes, notes, security) ──
  # Bound via @ConfigurationProperties("spring.datasource.primary") in PrimaryDataSourceConfig
  datasource:
    primary:
      url: jdbc:postgresql://localhost:5432/application_db
      username: postgres
      password: "0000"
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns all schema creation/migration — Hibernate must NOT attempt to
      # create, alter, or validate tables. Use 'none' to fully delegate to Flyway.
      # 'validate' would race against Flyway on a fresh DB and always fail.
      ddl-auto: none
    open-in-view: false
    show-sql: false

# ── Secondary datasource: MySQL (audit logs) ───────────────────────────────────
# Placed at root level (not under 'spring') to avoid YAML sibling-key collision.
# Bound via @ConfigurationProperties("app.datasource.secondary") in SecondaryDataSourceConfig.
app:
  datasource:
    secondary:
      url: jdbc:mysql://localhost:3306/audit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      username: root
      password: "0000"
      driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8083

security:
  jwt:
    secretKey: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 120000
    refresh-expiration: 604800000
    issuer: job-portal-service
  cors:
    allowed-origins:
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.learning: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
