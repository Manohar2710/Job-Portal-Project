spring:
  application:
    name: eureka-server

  # Spring Cloud 2024.0.1 officially targets Boot 3.4.x;
  # disable the version check so the server starts on Boot 3.5.x
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    # This IS the registry — it must not register with itself or fetch its own registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # In development, disable self-preservation so stale instances are evicted quickly.
    # In production, leave this enabled (default true) to handle network partitions.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
