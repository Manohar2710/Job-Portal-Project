<ui-auth-card [title]="'Register'" [subTitle]="'Please enter all mandatory imformation'">
    <form [formGroup]="form" (submit)="onSubmit()">
        <ui-form-field #email
            label="Email"
            type="email"
            placeholder="example@gmail.com"
            [control]="form.controls.email"
        />
        <ui-form-field
            label="First Name"
            type="text"
            placeholder="Manohar"
            [control]="form.controls.email"
        />
        <ui-form-field
            label="Last Name"
            type="text"
            placeholder="B"
            [control]="form.controls.email"
        />
        <ui-form-field
            label="Phone Number"
            type="phone"
            placeholder="9999999999"
            
        />
        <ui-form-field
            label="Password"
            type="password"
            placeholder="*********"
        />

        <ui-auth-button 
            label="SUBMIT"
        />
    </form>
</ui-auth-card>
