<mat-form-field appearance="outline" [class.mat-form-field-invalid]="hasError">
  <mat-label>{{ label }}</mat-label>

  <input
    matInput
    [id]="label"
    [type]="type"
    [placeholder]="placeholder"
    [formControl]="$any(control)"
  />

  @if (hasError) {
    <mat-error>{{ errorMessage }}</mat-error>
  }
</mat-form-field>
