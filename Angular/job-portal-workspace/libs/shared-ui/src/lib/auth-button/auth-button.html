<button
  mat-flat-button
  color="primary"
  class="auth-btn"
  type="submit"
  [disabled]="isDisabled"
  [attr.aria-busy]="loading"
  [attr.aria-disabled]="isDisabled"
>
  @if (loading) {
    <span class="auth-btn__spinner">
      <mat-progress-spinner
        diameter="18"
        strokeWidth="2"
        mode="indeterminate"
        color="accent"
      />
    </span>
  }
  {{ label }}
</button>
