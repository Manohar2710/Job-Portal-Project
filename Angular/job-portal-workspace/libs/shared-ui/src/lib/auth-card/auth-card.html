<div class="auth-page">
  <mat-card class="auth-card" appearance="outlined">

    <!-- Logo slot -->
    <div class="auth-card__logo">
      <ng-content select="[slot=logo]" />
    </div>

    <!-- Heading -->
    <mat-card-header class="auth-card__header">
      <mat-card-title class="jp-heading-xl">{{ title }}</mat-card-title>
      @if (subTitle) {
        <mat-card-subtitle class="jp-description">{{ subTitle }}</mat-card-subtitle>
      }
    </mat-card-header>

    <!-- Form body -->
    <mat-card-content class="auth-card__body">
      <ng-content />
    </mat-card-content>

  </mat-card>
</div>
